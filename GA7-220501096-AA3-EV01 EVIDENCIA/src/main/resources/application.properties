```properties
# Nombre de la aplicaci\u00f3n que se mostrar\u00e1 durante la ejecuci\u00f3n
spring.application.name=FORM_NOVACAM

# Configuraci\u00f3n de conexi\u00f3n con la base de datos MySQL
# URL de la base de datos utilizada por el proyecto NovaCam
spring.datasource.url=jdbc:mysql://localhost:3306/form_novacam

# Usuario de acceso a MySQL
spring.datasource.username=root

# Contrase\u00f1a del usuario de MySQL
spring.datasource.password=

# Driver que permite la comunicaci\u00f3n entre Spring Boot y MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate actualiza autom\u00e1ticamente la estructura de la base de datos
# seg\u00fan los cambios realizados en las entidades
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola las consultas SQL ejecutadas por Hibernate
spring.jpa.show-sql=true

# Dialecto utilizado para generar consultas compatibles con MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
```
